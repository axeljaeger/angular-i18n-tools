<article class="panel">
  <h2 i18n="User profile heading@@userProfile.title">User profile</h2>

  <dl>
    <div>
      <dt i18n="User profile name label@@userProfile.name">Name</dt>
      <dd>{{ name }}</dd>
    </div>
    <div>
      <dt i18n="User profile email label@@userProfile.email">Email</dt>
      <dd>{{ email }}</dd>
    </div>
  </dl>
</article>
