<article class="panel">
  <h2 i18n="Settings dialog title@@settingsDialog.title">Settings</h2>
  <p>{{ description }}</p>

  <div class="actions">
    <button type="button" class="secondary" i18n="Cancel settings button@@settingsDialog.cancelButton">Cancel</button>
    <button type="button" i18n="Apply settings button@@settingsDialog.applyButton">Apply</button>
  </div>
</article>
