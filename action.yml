name: Angular i18n Tools Check
description: Check Angular built-in localization JSON catalogs for duplicate, missing, and orphaned localization IDs.
author: Axel Jaeger
branding:
  icon: check-circle
  color: green

inputs:
  path:
    description: Angular project directory relative to the checked-out repository. Scan independent projects separately.
    required: false
    default: "."
  annotations:
    description: Emit error annotations on affected source and catalog lines.
    required: false
    default: "true"
  summary:
    description: Add finding counts, source links and repair guidance to the job summary.
    required: false
    default: "true"
  install-dependencies:
    description: Legacy compatibility input. Ignored; the bundled action needs no dependency installation.
    required: false
    default: "false"

runs:
  using: node24
  main: dist/catalog-action.mjs
