name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build, Test, And Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Build Storybook preview
        run: pnpm --filter @angular-i18n-tools/sample-angular run build-storybook

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Check sample localization catalogs
        run: pnpm run check:i18n

      - name: Smoke test reusable GitHub Action
        uses: ./
        with:
          path: apps/sample-angular
          install-dependencies: "false"
          annotations: "false"
