name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      publish:
        description: Publish npm packages when true.
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Package And Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Check sample localization catalogs
        run: pnpm run check:i18n

      - name: Create artifact directory
        run: mkdir -p artifacts

      - name: Pack core package
        run: npm pack ./packages/core --pack-destination artifacts

      - name: Pack Storybook addon package
        run: npm pack ./packages/storybook-addon --pack-destination artifacts

      - name: Pack Angular generator package
        run: npm pack ./packages/ng-generator --pack-destination artifacts

      - name: Package VS Code extension VSIX
        working-directory: packages/vscode-extension
        run: pnpm dlx @vscode/vsce package --no-dependencies --out ../../artifacts/angular-i18n-tools-vscode-extension.vsix

      - name: Publish core package to npm
        if: ${{ github.event_name == 'release' || inputs.publish == 'true' }}
        run: npm publish ./packages/core --access public --provenance

      - name: Publish Storybook addon package to npm
        if: ${{ github.event_name == 'release' || inputs.publish == 'true' }}
        run: npm publish ./packages/storybook-addon --access public --provenance

      - name: Publish Angular generator package to npm
        if: ${{ github.event_name == 'release' || inputs.publish == 'true' }}
        run: npm publish ./packages/ng-generator --access public --provenance

      - name: Upload release package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: artifacts/*

      - name: Attach artifacts to GitHub release
        if: ${{ github.event_name == 'release' }}
        run: gh release upload "${GITHUB_REF_NAME}" artifacts/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
